<div class="lista-container">
  <h2>Lista de Empleados</h2>
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Rol</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of empleados">
        <td>{{ e.nombre }}</td>
        <td>{{ e.apellido }}</td>
        <td>{{ e.correo }}</td>
        <td>{{ e.telefono }}</td>
        <td>{{ e.rol }}</td>
      </tr>
    </tbody>
  </table>
</div>
