<div class="max-w-4xl mx-auto p-6">
  <div class="bg-white rounded-lg shadow-lg p-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Registro de Pagos</h1>
      <p class="text-gray-600">Registra pagos manuales de nómina, servicios y otros conceptos</p>
    </header>

    <!-- Mensajes de éxito y error -->
    <div *ngIf="mensajeExito" class="mb-6 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
      <div class="flex items-center">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
        </svg>
        {{ mensajeExito }}
      </div>
    </div>

    <div *ngIf="mensajeError" class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
      <div class="flex items-center">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        {{ mensajeError }}
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #pagoForm="ngForm" class="space-y-6">
      <!-- Tipo de Pago -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="tipoPago" class="block text-sm font-medium text-gray-700 mb-2">
            Tipo de Pago *
          </label>
          <select 
            id="tipoPago" 
            name="tipoPago" 
            [(ngModel)]="nuevoPago.tipoPago" 
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            (change)="limpiarMensajes()">
            <option value="">Seleccione un tipo</option>
            <option *ngFor="let tipo of tiposPago" [value]="tipo">
              {{ obtenerDescripcionTipoPago(tipo) }}
            </option>
          </select>
        </div>

        <!-- Método de Pago -->
        <div>
          <label for="metodoPago" class="block text-sm font-medium text-gray-700 mb-2">
            Método de Pago *
          </label>
          <select 
            id="metodoPago" 
            name="metodoPago" 
            [(ngModel)]="nuevoPago.metodoPago" 
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            (change)="limpiarMensajes()">
            <option value="">Seleccione un método</option>
            <option *ngFor="let metodo of metodosPago" [value]="metodo">
              {{ metodo }}
            </option>
          </select>
        </div>
      </div>

      <!-- Monto y Fecha -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="monto" class="block text-sm font-medium text-gray-700 mb-2">
            Monto *
          </label>
          <div class="relative">
            <span class="absolute left-3 top-2 text-gray-500">$</span>
            <input 
              type="number" 
              id="monto" 
              name="monto" 
              [(ngModel)]="nuevoPago.monto" 
              required
              min="1"
              step="0.01"
              placeholder="0.00"
              class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              (input)="limpiarMensajes()">
          </div>
        </div>

        <div>
          <label for="fechaPago" class="block text-sm font-medium text-gray-700 mb-2">
            Fecha de Pago *
          </label>
          <input 
            type="date" 
            id="fechaPago" 
            name="fechaPago" 
            [(ngModel)]="nuevoPago.fechaPago" 
            required
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
            (change)="limpiarMensajes()">
        </div>
      </div>

      <!-- Organización (solo para servicios) -->
      <div *ngIf="nuevoPago.tipoPago === 'SERVICIO'">
        <label for="organizacionId" class="block text-sm font-medium text-gray-700 mb-2">
          Organización
        </label>
        <div *ngIf="cargandoOrganizaciones" class="flex items-center justify-center py-4">
          <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
          <span class="ml-2 text-gray-600">Cargando organizaciones...</span>
        </div>
        <select 
          *ngIf="!cargandoOrganizaciones"
          id="organizacionId" 
          name="organizacionId" 
          [(ngModel)]="nuevoPago.organizacionId" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          (change)="limpiarMensajes()">
          <option value="">Seleccione una organización</option>
          <option *ngFor="let org of organizaciones" [value]="org.id">
            {{ org.nombre }}
          </option>
        </select>
      </div>

      <!-- Descripción -->
      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-2">
          Descripción *
        </label>
        <textarea 
          id="descripcion" 
          name="descripcion" 
          [(ngModel)]="nuevoPago.descripcion" 
          required
          rows="3"
          placeholder="Describe el motivo del pago..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          (input)="limpiarMensajes()"></textarea>
      </div>

      <!-- Comprobante -->
      <div>
        <label for="comprobante" class="block text-sm font-medium text-gray-700 mb-2">
          Número de Comprobante
        </label>
        <input 
          type="text" 
          id="comprobante" 
          name="comprobante" 
          [(ngModel)]="nuevoPago.comprobante" 
          placeholder="Ej: TRANS-001234, CHEQUE-567890"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          (input)="limpiarMensajes()">
      </div>

      <!-- Estado -->
      <div>
        <label for="estado" class="block text-sm font-medium text-gray-700 mb-2">
          Estado del Pago
        </label>
        <select 
          id="estado" 
          name="estado" 
          [(ngModel)]="nuevoPago.estado" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
          (change)="limpiarMensajes()">
          <option value="COMPLETADO">Completado</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="FALLIDO">Fallido</option>
          <option value="REEMBOLSADO">Reembolsado</option>
        </select>
      </div>

      <!-- Botones -->
      <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
        <button 
          type="button" 
          (click)="inicializarFormulario()"
          class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Limpiar
        </button>
        <button 
          type="submit" 
          [disabled]="enviando || pagoForm.invalid"
          class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="enviando" class="flex items-center">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
            Registrando...
          </span>
          <span *ngIf="!enviando">Registrar Pago</span>
        </button>
      </div>
    </form>
  </div>
</div>
