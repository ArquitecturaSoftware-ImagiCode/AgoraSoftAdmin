<div class="dashboard-container" *ngIf="!cargando && !error">
  <h2 class="dashboard-title">Panel de Tesorería</h2>

  <div class="usuario-info" *ngIf="usuario">
    <div class="usuario-header">
      <h3>{{ usuario.nombre }} {{ usuario.apellido }}</h3>
      <p class="usuario-rol">{{ usuario.rol }}</p>
    </div>

    <div class="usuario-detalles">
      <p><strong>Correo:</strong> {{ usuario.correo }}</p>
      <p><strong>Organización:</strong> {{ usuario.organizacion }}</p>
    </div>
  </div>

  <div *ngIf="!usuario" class="usuario-vacio">
    <p>No se encontró información del usuario.</p>
  </div>
</div>

<div *ngIf="cargando" class="loading-container">
  <div class="spinner"></div>
  <p>Cargando información...</p>
</div>

<div *ngIf="error" class="error-container">
  <p>{{ error }}</p>
</div>
