<section class="page">
  <div class="page-header">
    <h2>Gestión de Empleados</h2>
    <div class="actions">
      <input [formControl]="searchControl" placeholder="Buscar por nombre, correo..." />
      <button (click)="crearEmpleado()" class="btn primary">+ Nuevo</button>
    </div>
  </div>

  <div *ngIf="loading" class="loader">Cargando empleados...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <table *ngIf="!loading && empleados.length" class="table">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th>
        <th>Departamento</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of empleados">
        <td>{{ e.nombre }} {{ e.apellido }}</td>
        <td>{{ e.correo }}</td>
        <td>{{ e.rolDescripcion || e.rol }}</td>
        <td>{{ e.departamento }}</td>
        <td>
          <span class="badge" [class.active]="e.activo">{{ e.activo ? 'Sí' : 'No' }}</span>
        </td>
        <td class="actions-col">
          <button (click)="verEmpleado(e.id)" title="Ver">Ver</button>
          <button (click)="editarEmpleado(e.id)" title="Editar">Editar</button>
          <button (click)="toggleActivo(e)" title="Activar/Desactivar">
            {{ e.activo ? 'Desactivar' : 'Activar' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && !empleados.length" class="empty">No se encontraron empleados</div>
</section>
