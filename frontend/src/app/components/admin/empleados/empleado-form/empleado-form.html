<section class="form-page">
  <h2>{{ isEdit ? 'Editar Empleado' : 'Nuevo Empleado' }}</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row">
      <label>Nombre</label>
      <input formControlName="nombre" />
      <small *ngIf="form.controls['nombre'].invalid && form.controls['nombre'].touched"
        >Nombre obligatorio</small
      >
    </div>

    <div class="row">
      <label>Apellido</label>
      <input formControlName="apellido" />
    </div>

    <div class="row">
      <label>Correo</label>
      <input formControlName="correo" />
      <small *ngIf="form.controls['correo'].invalid && form.controls['correo'].touched"
        >Correo inválido</small
      >
    </div>

    <div class="row">
      <label>Rol</label>
      <select formControlName="rol">
        <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
      </select>
    </div>

    <div class="row">
      <label>Departamento</label>
      <input formControlName="departamento" />
    </div>

    <div class="row">
      <label>Teléfono</label>
      <input formControlName="telefono" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn primary" [disabled]="loading">
        {{ isEdit ? 'Guardar' : 'Crear' }}
      </button>
      <button type="button" (click)="cancelar()" class="btn">Cancelar</button>
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</section>
