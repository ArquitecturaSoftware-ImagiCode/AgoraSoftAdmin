<section class="panel">
  <h2>Aprobar plaza</h2>

  <div *ngIf="plaza" class="plaza-card">
    <h3>{{ plaza.nombre }}</h3>
    <p>{{ plaza.representanteLegal }} — {{ plaza.emailContacto }}</p>

    <form [formGroup]="form" (ngSubmit)="aprobar()">
      <div class="row">
        <label>Plan inicial</label>
        <input formControlName="planInicial" />
      </div>

      <div class="row">
        <label>Monto mensual</label>
        <input type="number" formControlName="montoMensual" />
      </div>

      <div class="row">
        <label>Método de pago</label>
        <input formControlName="metodoPago" />
      </div>

      <div class="actions">
        <button type="submit" class="btn primary">Aprobar</button>
        <button type="button" class="btn" (click)="rechazar()">Rechazar</button>
        <button type="button" class="btn danger" (click)="suspender()">Suspender</button>
      </div>
    </form>
  </div>

  <div *ngIf="!plaza" class="empty">Plaza no encontrada</div>
</section>
