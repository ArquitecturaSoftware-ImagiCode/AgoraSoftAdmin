<div class="sidebar" role="navigation" aria-label="Sidebar admin">
  <div class="sidebar-header">
    <div class="logo" title="AgoraSoft Admin">
      <span class="logo-icon" aria-hidden>🏪</span>
      <span class="logo-text">AgoraSoft</span>
    </div>
  </div>

  <div class="user-info" *ngIf="empleadoActual">
    <div class="user-avatar" aria-hidden>
      {{ empleadoActual.nombre?.charAt(0) || 'A' }}{{ empleadoActual.apellido?.charAt(0) || 'U' }}
    </div>
    <div class="user-details">
      <div class="user-name">{{ empleadoActual.nombre }} {{ empleadoActual.apellido }}</div>
      <div class="user-role">{{ empleadoActual.rolDescripcion || empleadoActual.rol }}</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <ul class="nav-list">
      <li *ngFor="let item of menuItems" class="nav-item" [class.active]="item.active">
        <a (click)="navegarA(item.route)" class="nav-link" role="button" tabindex="0">
          <span class="material-icons nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
          <span class="nav-badge" *ngIf="item.badge && item.badge > 0">{{ item.badge }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="btn-logout" (click)="cerrarSesion()" aria-label="Cerrar sesión">
      <span class="material-icons">logout</span>
      <span>Cerrar sesión</span>
    </button>
  </div>
</div>
