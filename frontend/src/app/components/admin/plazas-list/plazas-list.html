<section class="page">
  <div class="page-header">
    <h2>Gestión de Plazas</h2>
    <div class="actions">
      <input [formControl]="searchControl" placeholder="Buscar por nombre, RUT o representante..." />
      <select (change)="cargarPlazas()">
        <option value="">Todos</option>
        <option *ngFor="let e of estados" [value]="e">{{ e }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="loading" class="loader">Cargando plazas...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && plazas.length" class="list">
    <div *ngFor="let p of plazas" class="item">
      <div class="left">
        <div class="name">{{ p.nombre }}</div>
        <div class="meta">{{ p.representanteLegal }} • {{ p.rut }}</div>
      </div>
      <div class="right">
        <span class="status" [class.active]="p.estado === 'ACTIVA'">{{ p.estadoDescripcion }}</span>
        <button (click)="verPlaza(p.id)">Ver</button>
        <button *ngIf="p.estado === 'PENDIENTE'" (click)="abrirAprobacion(p.id)">Aprobar</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && !plazas.length" class="empty">No se encontraron plazas</div>
</section>
